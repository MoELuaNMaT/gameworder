# trigger-3
name: Temporary Bilibili Bridge

on:
  push:
    paths:
      - '.github/workflows/bilibili_bridge_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -U curl_cffi pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch through Bilibili API with browser impersonation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bridge_out/frames
          python - <<'PY'
          from curl_cffi import requests
          from pathlib import Path
          import json, re, time

          bvid='BV1gJK2zmEa6'
          out=Path('bridge_out')
          headers={
              'Referer':'https://www.bilibili.com/',
              'Origin':'https://www.bilibili.com',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          }
          s=requests.Session(impersonate='chrome')

          def get_json(url, tries=4):
              last=None
              for i in range(tries):
                  r=s.get(url, headers=headers, timeout=30)
                  last=(r.status_code, r.text[:500])
                  if r.status_code==200:
                      try:
                          j=r.json()
                          if j.get('code',0)==0:
                              return j
                      except Exception:
                          pass
                  time.sleep(1.5*(i+1))
              raise RuntimeError(f'GET failed {url}: {last}')

          view=get_json(f'https://api.bilibili.com/x/web-interface/view?bvid={bvid}')
          (out/'metadata.json').write_text(json.dumps(view,ensure_ascii=False,indent=2),encoding='utf-8')
          data=view['data']
          cid=data['cid']
          print('TITLE:',data.get('title'))
          print('CID:',cid,'DURATION:',data.get('duration'))

          # Subtitle metadata + bodies when exposed.
          player=get_json(f'https://api.bilibili.com/x/player/v2?bvid={bvid}&cid={cid}')
          (out/'player.json').write_text(json.dumps(player,ensure_ascii=False,indent=2),encoding='utf-8')
          subs=((player.get('data') or {}).get('subtitle') or {}).get('subtitles') or []
          transcript=[]
          for idx,sub in enumerate(subs):
              u=sub.get('subtitle_url') or ''
              if u.startswith('//'): u='https:'+u
              if not u: continue
              r=s.get(u,headers=headers,timeout=30)
              if r.status_code!=200: continue
              p=out/f'subtitle_{idx:02d}.json'
              p.write_bytes(r.content)
              try:
                  sj=r.json()
                  transcript.append(f"===== {sub.get('lan_doc') or sub.get('lan')} =====")
                  for row in sj.get('body',[]):
                      transcript.append(f"[{row.get('from',0):.2f}-{row.get('to',0):.2f}] {row.get('content','')}")
              except Exception:
                  pass
          (out/'transcript.txt').write_text('\n'.join(transcript) if transcript else 'NO_SUBTITLE_EXPOSED',encoding='utf-8')

          # Fetch low-res progressive stream directly (DURL mode) for visual inspection.
          play=get_json(f'https://api.bilibili.com/x/player/playurl?bvid={bvid}&cid={cid}&qn=32&fnval=0&fourk=0')
          (out/'playurl.json').write_text(json.dumps(play,ensure_ascii=False,indent=2),encoding='utf-8')
          durls=(play.get('data') or {}).get('durl') or []
          if not durls:
              raise RuntimeError('No progressive durl returned')
          parts=[]
          for i,d in enumerate(durls):
              u=d['url']
              r=s.get(u,headers={**headers,'Referer':f'https://www.bilibili.com/video/{bvid}/'},timeout=120)
              r.raise_for_status()
              p=out/f'part_{i:02d}.flv'
              p.write_bytes(r.content)
              parts.append(p)
          (out/'concat.txt').write_text('\n'.join("file '"+p.name+"'" for p in parts),encoding='utf-8')
          PY

          cd bridge_out
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c copy video.mp4 || ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c:v libx264 -c:a aac video.mp4
          cd ..
          ffmpeg -hide_banner -loglevel error -i bridge_out/video.mp4 -vf 'fps=1/5,scale=720:-2' -q:v 3 'bridge_out/frames/frame_%03d.jpg'

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          frames=sorted(Path('bridge_out/frames').glob('frame_*.jpg'))
          cols,rows=4,4
          cell_w,cell_h=720,440
          for s in range(0,len(frames),cols*rows):
              chunk=frames[s:s+cols*rows]
              sheet=Image.new('RGB',(cols*cell_w,rows*cell_h),'white')
              for i,p in enumerate(chunk):
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((cell_w,cell_h-30))
                  x=(i%cols)*cell_w+(cell_w-im.width)//2
                  y=(i//cols)*cell_h
                  sheet.paste(im,(x,y))
                  ImageDraw.Draw(sheet).text(((i%cols)*cell_w+8,y+cell_h-25),p.stem,fill='black')
              sheet.save(f'bridge_out/contact_{s//(cols*rows)+1:02d}.jpg',quality=90)
          PY

          echo '===== TRANSCRIPT START ====='
          cat bridge_out/transcript.txt
          echo '===== TRANSCRIPT END ====='
          ls -lah bridge_out bridge_out/frames

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-psd-to-ai-bridge
          path: |
            bridge_out/metadata.json
            bridge_out/player.json
            bridge_out/transcript.txt
            bridge_out/subtitle_*.json
            bridge_out/contact_*.jpg
          if-no-files-found: warn
          retention-days: 1
